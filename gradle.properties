org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ADR 0001: KSP (needed for Hilt/Room) does not support AGP 9's built-in
# Kotlin yet. Opting out re-enables the traditional org.jetbrains.kotlin.android
# plugin, which KSP/kapt-based tooling is built for. Both flags are required:
# builtInKotlin alone still leaves AGP 9's new DSL active, which also rejects
# org.jetbrains.kotlin.android (confirmed by a real CI failure - see
# docs/adr/0001-kotlin-ksp-with-agp9.md).
android.builtInKotlin=false
android.newDsl=false

# Roadmap M1: package name and working title, centralized in one place.
# Teil-Roadmap 4 (m-5): the build properties are named auracurve.* (formerly hardbasseq.*). The
# database file keeps its old name hardbasseq.db (DatabaseModule.kt) so existing users keep their data.
# Update both together; also update app_name in
# app/src/main/res/values*/strings.xml if the display name should change too.
auracurve.applicationId=com.auracurve.app
auracurve.namespace=com.auracurve.app

# Debug/local-build fallback only (app/build.gradle.kts reads it via
# providers.gradleProperty(...).getOrElse(1)) - a real signed release
# (.github/workflows/release.yml) always passes its own -Pauracurve.versionCode
# computed from the CI run number, which overrides this. Bumped by hand per the
# team's own convention: +1 here for a large change; a small change instead
# bumps auracurve.versionName's own fallback (currently the "0.2.0-m1"
# default in app/build.gradle.kts, e.g. to "0.2.1-m1").
auracurve.versionCode=2

# Same debug-fallback-only rule as above, for the small-change side of the
# team's convention: this MBC bass-band release-time tuning (Session 24,
# roadmap.md) doesn't warrant a versionCode bump on its own.
auracurve.versionName=0.2.1-m1
