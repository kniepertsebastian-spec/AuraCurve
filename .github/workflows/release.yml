name: Signed Android release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # A tag can point at any commit, including one that never went through the CI on main. Do not
      # sign and publish code that fails the format check, the tests or Lint: the same gates as the CI.
      - name: Run ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:test --stacktrace

      - name: Run Android Lint on the release variant
        run: ./gradlew lintRelease --stacktrace

      # The store build: an AAB for the Play Console upload and an APK for sideloading or a device
      # test. Both are signed with the persistent release key (the Play upload key). versionCode
      # must only grow for Play, so it comes from the run number, as in the Equalizer repository.
      #
      # Signing (Teil-Roadmap 4, M-7): the passwords reach Gradle only as environment variables
      # (app/build.gradle.kts reads AURACURVE_RELEASE_*), never as command-line arguments, so they
      # do not show up in a process list or in Gradle's own logs. Store and key password are two
      # separate secrets. The HARDBASS_* names are the old secrets, read only until the new ones
      # exist (user_todo.md); the key alias inside the existing upload keystore stays "hardbasseq"
      # because the keystore itself cannot be renamed without a new upload key.
      - name: Build signed AAB and APK
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.AURACURVE_RELEASE_KEYSTORE_BASE64 || secrets.HARDBASS_RELEASE_KEYSTORE_BASE64 }}
          AURACURVE_RELEASE_STORE_PASSWORD: ${{ secrets.AURACURVE_RELEASE_STORE_PASSWORD || secrets.HARDBASS_RELEASE_PASSWORD }}
          AURACURVE_RELEASE_KEY_PASSWORD: ${{ secrets.AURACURVE_RELEASE_KEY_PASSWORD || secrets.HARDBASS_RELEASE_PASSWORD }}
          AURACURVE_RELEASE_KEY_ALIAS: hardbasseq
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Unsupported release tag"; exit 1; }
          [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$AURACURVE_RELEASE_STORE_PASSWORD" && -n "$AURACURVE_RELEASE_KEY_PASSWORD" ]] \
            || { echo "Release signing secrets are missing"; exit 1; }
          export AURACURVE_RELEASE_STORE_FILE="$RUNNER_TEMP/auracurve-release.jks"
          trap 'rm -f "$AURACURVE_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$AURACURVE_RELEASE_STORE_FILE"
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          VERSION_NAME="${TAG#v}"
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace \
            -Pauracurve.versionCode="$VERSION_CODE" \
            -Pauracurve.versionName="$VERSION_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "AuraCurve-${TAG}.aab"
          cp app/build/outputs/apk/release/app-release.apk "AuraCurve-${TAG}.apk"
          # R8's mapping (AuraCurve roadmap 01, step 3): obfuscated stack traces from the Play Console
          # or a bug report are only readable with the mapping of exactly this build. The AAB carries
          # it for Play as well; the copy here is for the Play Console's manual upload and for retrace.
          test -s app/build/outputs/mapping/release/mapping.txt || { echo "R8 mapping.txt is missing"; exit 1; }
          cp app/build/outputs/mapping/release/mapping.txt "AuraCurve-${TAG}-mapping.txt"

      # The same guard as in the CI, on the APK that is actually published.
      - name: Check that the release APK has no online-access code
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 -I scripts/check_store_apk.py "AuraCurve-${TAG}.apk"

      # Kept as a workflow artifact too, so the mapping survives even if the release assets change.
      - name: Keep the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.event.release.tag_name }}
          path: AuraCurve-${{ github.event.release.tag_name }}-mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Attach signed AAB, APK and R8 mapping
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "AuraCurve-${TAG}.aab" "AuraCurve-${TAG}.apk" "AuraCurve-${TAG}-mapping.txt" --clobber
