name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew ktlintCheck --stacktrace

      # ktlintCheck only prints "violations found, see report" to the
      # console, not the violations themselves - print the actual report
      # contents into the job log too so a failure is diagnosable without
      # downloading the ktlint-reports artifact.
      - name: Print ktlint violations
        if: failure()
        run: |
          find app/build/reports/ktlint core/build/reports/ktlint \
            -name '*.txt' -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint
            core/build/reports/ktlint
          if-no-files-found: warn

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Guard: the APK must not contain online access that is not cleared, e.g. SoundCloud access
      # outside the official API, Spotify/YouTube link resolution or a self-update
      # (markers in scripts/check_store_apk.py).
      - name: Check that the APK has no online-access code
        run: python3 -I scripts/check_store_apk.py app/build/outputs/apk/debug/app-debug.apk

      # :core is a plain Kotlin/JVM module and doesn't use the Android
      # testDebugUnitTest task above, so it needs its own test invocation.
      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/test
          if-no-files-found: warn

      # Roadmap 06, P6-3: the instrumented tests need a device and are not run here, but they must
      # at least keep compiling. The release build (R8, P6-6) is built too, so a missing keep rule
      # that makes shrinking fail shows up before a release tag does.
      - name: Compile instrumented tests and build the release APK
        run: ./gradlew :app:compileDebugAndroidTestKotlin :app:assembleRelease --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # PlayerShellUiTest renders the player's screens on the JVM and writes one PNG each; kept
      # as an artifact for a look at the layout without a device.
      - name: Upload player screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-screenshots
          path: app/build/player-screenshots
          if-no-files-found: warn

      # EqualizerScreenUiTest (AuraCurve roadmap 04, part A): every tab, the signal chain sheet, a short
      # phone and landscape, rendered on the JVM.
      - name: Upload equalizer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equalizer-screenshots
          path: app/build/equalizer-screenshots
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests
          if-no-files-found: warn
